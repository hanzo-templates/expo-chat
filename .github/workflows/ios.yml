name: iOS Archive
# Opt-in only: no macOS runner is in the fleet yet, so this would queue forever
# on push. See README "Building for iOS".
on:
  workflow_dispatch:
jobs:
  archive:
    runs-on: [self-hosted, macos, arm64, xcode]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: npm ci
      - run: npx expo prebuild -p ios --no-install
      - run: |
          xcodebuild -workspace ios/*.xcworkspace -scheme "expo-chat" \
            -configuration Release -archivePath build/app.xcarchive archive
